trigger:
  branches:
    include:
    - main
  tags:
    include:
    - 'v*'

pool:
  vmImage: 'windows-latest'

variables:
  - name: BuildConfiguration
    value: 'Release'
  - name: isProdRelease
    value: $[and(startsWith(variables['Build.SourceBranchName'], 'v'), contains(variables['Build.SourceBranchName'], '-PROD'))]
  - name: isNonProdRelease
    value: $[and(startsWith(variables['Build.SourceBranchName'], 'v'), contains(variables['Build.SourceBranchName'], '-NONPROD'))]
  - name: isRelease
    value: $[or(eq(variables.isProdRelease, true), eq(variables.isNonProdRelease, true))]

stages:
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
    - job: BuildAndTest
      steps:

      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '8.x'
          installationPath: $(Agent.ToolsDirectory)/dotnet
          
      - task: DotNetCoreCLI@2
        displayName: 'Build project'
        inputs:
          command: 'build'
          projects: '**/*.csproj'
          arguments: '--configuration $(BuildConfiguration)'
        
      - task: DotNetCoreCLI@2
        displayName: 'Run tests'
        inputs:
          command: 'test'
          projects: '**/*.csproj'
          arguments: '--configuration $(BuildConfiguration) --logger trx --collect:"XPlat Code Coverage"'
          publishTestResults: true
          testRunTitle: 'Unit Tests'
  
      - task: DotNetCoreCLI@2
        displayName: 'Publish project'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: '**/defra-people-api.csproj'
          arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'
          zipAfterPublish: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Build Artifacts'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'drop'
          publishLocation: 'Container'

  - stage: DeployToNonProd
    displayName: 'Deploy to Non-Production'
    dependsOn: BuildAndTest
    condition: and(succeeded(), or(eq(variables.isNonProdRelease, true), eq(variables.isProdRelease, true)))
    variables:
      - group: People-API-NONPROD
    jobs:
    - job: Deploy
      displayName: 'Deploy to Non-Production'
      steps:
      - download: current
        artifact: drop
        displayName: 'Download Build Artifacts'
        
      - task: ExtractFiles@1
        displayName: 'Extract Files'
        inputs:
          archiveFilePatterns: '$(Pipeline.Workspace)/drop/*.zip'
          destinationFolder: '$(Pipeline.Workspace)/extracted'
          cleanDestinationFolder: true
          
      - task: FileTransform@2
        displayName: 'File transformation: appsettings.json'
        inputs:
          folderPath: '$(Pipeline.Workspace)/extracted'
          jsonTargetFiles: '**/appsettings.json'
          xmlTransformationRules:
          
      - task: ArchiveFiles@2
        displayName: 'Archive Files'
        inputs:
          rootFolderOrFile: '$(Pipeline.Workspace)/extracted'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: '$(Pipeline.Workspace)/transformed/defra-people-api.zip'
          replaceExistingArchive: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Deployable Artifact'
        inputs:
          PathtoPublish: '$(Pipeline.Workspace)/transformed'
          ArtifactName: 'nonprod-deployable'
          publishLocation: 'Container'

      - script: |
          echo "Deploying to NONPROD environment"
          echo "Artifact downloaded to: $(Pipeline.Workspace)/drop"
          echo "Transformed artifact published as: nonprod-deployable"
        displayName: 'Deploy to NONPROD'

  - stage: DeployToProd
    displayName: 'Deploy to Production'
    dependsOn: DeployToNonProd
    condition: and(succeeded(), eq(variables.isProdRelease, true))
    variables:
      - group: People-API-PROD
    jobs:
    - job: Deploy
      displayName: 'Deploy to Production'
      steps:
      - download: current
        artifact: drop
        displayName: 'Download Build Artifacts'
        
      - task: ExtractFiles@1
        displayName: 'Extract Files'
        inputs:
          archiveFilePatterns: '$(Pipeline.Workspace)/drop/*.zip'
          destinationFolder: '$(Pipeline.Workspace)/extracted'
          cleanDestinationFolder: true
          
      - task: FileTransform@2
        displayName: 'File transformation: appsettings.json'
        inputs:
          folderPath: '$(Pipeline.Workspace)/extracted'
          jsonTargetFiles: '**/appsettings.json'
          xmlTransformationRules:
          
      - task: ArchiveFiles@2
        displayName: 'Archive Files'
        inputs:
          rootFolderOrFile: '$(Pipeline.Workspace)/extracted'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: '$(Pipeline.Workspace)/transformed/defra-people-api.zip'
          replaceExistingArchive: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Deployable Artifact'
        inputs:
          PathtoPublish: '$(Pipeline.Workspace)/transformed'
          ArtifactName: 'prod-deployable'
          publishLocation: 'Container'

      - script: |
          echo "Deploying to PROD environment"
          echo "Artifact downloaded to: $(Pipeline.Workspace)/drop"
          echo "Transformed artifact published as: prod-deployable"
        displayName: 'Deploy to PROD'
